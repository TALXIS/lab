name: deploy
# Named after the commit this deploy actually ships: a workflow_run run otherwise shows main's
# latest commit at the time it starts, so two builds merged a minute apart look like one
# commit deployed twice.
run-name: deploy ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
# One deploy to Test at a time, in order: without this, two quick merges deploy in parallel
# and the older package can finish importing after the newer one.
concurrency:
  group: deploy-test
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drop
          path: ./drop
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install txc
        run: dotnet tool install --global TALXIS.CLI

      - name: Configure txc WIF auth
        env:
          AZURE_CLIENT_ID: __AZURE_CLIENT_ID__
          AZURE_TENANT_ID: __AZURE_TENANT_ID__
          DATAVERSE_TEST_URL: __DATAVERSE_TEST_URL__
        run: |
          txc config auth add-federated --alias ci --tenant $AZURE_TENANT_ID --application-id $AZURE_CLIENT_ID
          txc config connection create test --provider Dataverse --url $DATAVERSE_TEST_URL
          txc config profile create --name ci --auth ci --connection test

      - name: Import TALXIS Grid control package
        run: txc env pkg import TALXIS.Controls.Grid.Package --profile ci

      - name: Deploy package to Test environment
        run: txc env pkg import ./drop/Packages.Main.pdpkg.zip --profile ci
